{% extends "base.html" %}
{% block content %}
<h1>{{ poll.title }}</h1>
Poll Description:
<div class="entry-body">
    {{ poll.text }}
</div>
<p></p>
<div class="poll-score">
    Current Score: {{ poll.score }}
</div>
<div class ="poll-vote">
    <form method="POST">
        {% csrf_token %}
        <input type="submit" name="vote" value="Yes">
        <input type="submit" name="vote" value="No">
    </form>
</div>
{% endblock %}
